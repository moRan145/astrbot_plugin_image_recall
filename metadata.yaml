name: astrbot_plugin_image_recall
display_name: 按需识图
short_desc: 平时只缓存最近图片，用户问图时再调用视觉模型识别。
desc: >-
  缓存每个会话最近 N 张图片的 URL，不主动调用视觉模型；当用户 @ 机器人并提到“图/上面/刚才/那张/看看/识别”时，取最近一张图片识别，并把描述注入当前消息。支持“第2张/上一张”等简单定位。
  本项目由 AI（DeepSeek Harness）根据用户需求实现，代码与文档由 AI 起草，请自行审查。
help: 直接发图不会识别；需要时 @ 机器人问“上面那张图是什么”“看看刚才的图”。
version: 0.1.1
author: moRan145
repo: https://github.com/moRan145/astrbot_plugin_image_recall
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
tags:
  - image
  - vision
  - ocr
  - qqbot
  - ai
